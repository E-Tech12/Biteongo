{% extends "base.html" %}

{% block title %}Sign Up | Bite On Go{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 500px;
        margin: 60px auto;
        padding: 40px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 0.6s ease-out;
    }
    
    .form-container h2 {
        font-size: 28px;
        font-weight: bold;
        color: #1f2937;
        margin-bottom: 30px;
        text-align: center;
        position: relative;
    }
    
    .form-container h2:after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: #f97316;
        border-radius: 2px;
    }
    
    .form-container label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
        font-size: 14px;
    }
    
    .form-container input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s ease;
        margin-bottom: 20px;
        outline: none;
    }
    
    .form-container input:focus {
        border-color: #f97316;
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }
    
    .form-container input.error {
        border-color: #ef4444;
    }
    
    .form-container button {
        width: 100%;
        background: #f97316;
        color: white;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
    }
    
    .form-container button:hover {
        background: #ea580c;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
    }
    
    .form-container button:disabled {
        background: #d97706;
        cursor: not-allowed;
        opacity: 0.7;
        transform: none;
    }
    
    .helper {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
    }
    
    .helper p {
        color: #6b7280;
        font-size: 14px;
        margin: 10px 0;
    }
    
    .helper a {
        color: #f97316;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
    }
    
    .helper a:hover {
        color: #ea580c;
        text-decoration: underline;
    }
    
    .error-message {
        color: #ef4444;
        font-size: 12px;
        margin-top: -15px;
        margin-bottom: 15px;
        display: block;
    }
    
    .success-message {
        color: #10b981;
        font-size: 12px;
        margin-top: -15px;
        margin-bottom: 15px;
        display: block;
    }
    
    .password-strength {
        margin-top: -15px;
        margin-bottom: 15px;
    }
    
    .strength-bar {
        height: 4px;
        background: #e5e7eb;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 8px;
    }
    
    .strength-fill {
        height: 100%;
        width: 0%;
        transition: width 0.3s ease, background 0.3s ease;
        border-radius: 2px;
    }
    
    .strength-text {
        font-size: 11px;
        margin-top: 5px;
        display: block;
    }
    
    .popup-message {
        visibility: hidden;
        min-width: 300px;
        background-color: #f97316;
        color: white;
        text-align: center;
        border-radius: 12px;
        padding: 16px;
        position: fixed;
        z-index: 1000;
        top: 30px;
        right: 30px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        opacity: 0;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    .popup-message.show {
        visibility: visible;
        opacity: 1;
    }
    
    .terms {
        margin: 20px 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .terms input {
        width: auto;
        margin: 0;
        cursor: pointer;
    }
    
    .terms label {
        margin: 0;
        font-weight: normal;
        font-size: 13px;
        cursor: pointer;
    }
    
    .terms a {
        color: #f97316;
        text-decoration: none;
    }
    
    .terms a:hover {
        text-decoration: underline;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Password input with toggle */
    .password-wrapper {
        position: relative;
    }
    
    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #9ca3af;
        transition: color 0.3s ease;
    }
    
    .toggle-password:hover {
        color: #f97316;
    }
    
    /* Social signup */
    .social-signup {
        margin-top: 25px;
    }
    
    .social-signup p {
        text-align: center;
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 15px;
        position: relative;
    }
    
    .social-signup p:before,
    .social-signup p:after {
        content: '';
        position: absolute;
        top: 50%;
        width: 30%;
        height: 1px;
        background: #e5e7eb;
    }
    
    .social-signup p:before {
        left: 0;
    }
    
    .social-signup p:after {
        right: 0;
    }
    
    .social-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
    }
    
    .social-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        background: white;
        color: #374151;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .social-btn:hover {
        border-color: #f97316;
        background: #fff7ed;
        transform: translateY(-2px);
    }
    
    .social-btn i {
        font-size: 20px;
    }
    
    .social-btn.google i {
        color: #db4437;
    }
    
    .social-btn.facebook i {
        color: #4267b2;
    }
</style>

<div class="min-h-screen bg-gradient-to-r from-orange-50 to-amber-50 py-12">
    <div class="form-container">
        <h2>Create Account 🍔</h2>
        <p style="text-align: center; color: #6b7280; margin-bottom: 30px; font-size: 14px;">
            Join BiteOnGo and start ordering delicious food!
        </p>
        
        <form id="signupForm" method="POST" action="{{ url_for('auth.register') }}">
            <div class="grid grid-cols-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 5px;">
                <div>
                    <label for="firstname">
                        <i class="fas fa-user" style="margin-right: 8px; color: #f97316;"></i>
                        First Name
                    </label>
                    <input type="text" id="firstname" name="first_name" placeholder="Enter first name" required>
                    <div id="firstnameError" class="error-message"></div>
                </div>
                
                <div>
                    <label for="lastname">
                        <i class="fas fa-user" style="margin-right: 8px; color: #f97316;"></i>
                        Last Name
                    </label>
                    <input type="text" id="lastname" name="last_name" placeholder="Enter last name" required>
                    <div id="lastnameError" class="error-message"></div>
                </div>
            </div>
            
            <label for="email">
                <i class="fas fa-envelope" style="margin-right: 8px; color: #f97316;"></i>
                Email Address
            </label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <div id="emailError" class="error-message"></div>
            
            <label for="password">
                <i class="fas fa-lock" style="margin-right: 8px; color: #f97316;"></i>
                Password
            </label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <span class="toggle-password" onclick="togglePassword('password')">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <div id="passwordError" class="error-message"></div>
            <div class="password-strength">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <span class="strength-text" id="strengthText"></span>
            </div>
            
            <label for="confirm_password">
                <i class="fas fa-check-circle" style="margin-right: 8px; color: #f97316;"></i>
                Confirm Password
            </label>
            <div class="password-wrapper">
                <input type="password" id="confirm_password" placeholder="Confirm your password" required>
                <span class="toggle-password" onclick="togglePassword('confirm_password')">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <div id="confirmError" class="error-message"></div>
            
            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the <a href="#" target="_blank">Terms of Service</a> and 
                    <a href="#" target="_blank">Privacy Policy</a>
                </label>
            </div>
            
            <button type="submit" id="signupBtn">
                <i class="fas fa-user-plus" style="margin-right: 8px;"></i>
                Create Account
            </button>
        </form>
        <div class="helper">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
        </div>
    </div>
</div>

<div id="popup-message" class="popup-message">
    <i class="fas fa-info-circle" style="margin-right: 10px;"></i>
    <span id="popup-text"></span>
</div>

<script>
    const popup = document.getElementById('popup-message');
    const popupText = document.getElementById('popup-text');
    const signupForm = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    
    // Input elements
    const firstnameInput = document.getElementById('firstname');
    const lastnameInput = document.getElementById('lastname');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    const termsCheckbox = document.getElementById('terms');
    
    // Error elements
    const firstnameError = document.getElementById('firstnameError');
    const lastnameError = document.getElementById('lastnameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const confirmError = document.getElementById('confirmError');
    
    // Show flashed messages
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                popupText.textContent = "{{ message }}";
                popup.classList.add('show');
                
                {% if category == 'error' %}
                    popup.style.backgroundColor = '#ef4444';
                {% elif category == 'success' %}
                    popup.style.backgroundColor = '#10b981';
                {% else %}
                    popup.style.backgroundColor = '#f97316';
                {% endif %}
                
                setTimeout(() => {
                    popup.classList.remove('show');
                    popup.style.backgroundColor = '#f97316';
                }, 4000);
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    // Toggle password visibility
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = field.nextElementSibling.querySelector('i');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    
    // Password strength checker
    function checkPasswordStrength(password) {
        let strength = 0;
        let message = '';
        let color = '';
        
        if (password.length >= 6) strength += 1;
        if (password.length >= 10) strength += 1;
        if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 1;
        if (password.match(/[0-9]/)) strength += 1;
        if (password.match(/[^a-zA-Z0-9]/)) strength += 1;
        
        switch(strength) {
            case 0:
            case 1:
                message = 'Very Weak';
                color = '#ef4444';
                break;
            case 2:
                message = 'Weak';
                color = '#f97316';
                break;
            case 3:
                message = 'Medium';
                color = '#eab308';
                break;
            case 4:
                message = 'Strong';
                color = '#10b981';
                break;
            case 5:
                message = 'Very Strong';
                color = '#059669';
                break;
        }
        
        const width = (strength / 5) * 100;
        document.getElementById('strengthFill').style.width = width + '%';
        document.getElementById('strengthFill').style.background = color;
        document.getElementById('strengthText').textContent = message;
        document.getElementById('strengthText').style.color = color;
        
        return strength >= 3;
    }
    
    // Validation functions
    function validateName(name, field) {
        if (name.length < 2) {
            return 'Name must be at least 2 characters';
        }
        if (!/^[a-zA-Z\s\-']+$/.test(name)) {
            return 'Name can only contain letters, spaces, hyphens, and apostrophes';
        }
        return '';
    }
    
    function validateEmail(email) {
        const re = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
        if (!re.test(email)) {
            return 'Please enter a valid email address';
        }
        return '';
    }
    
    function validatePassword(password) {
        if (password.length < 6) {
            return 'Password must be at least 6 characters';
        }
        return '';
    }
    
    function validateConfirm(password, confirm) {
        if (password !== confirm) {
            return 'Passwords do not match';
        }
        return '';
    }
    
    // Real-time validation
    firstnameInput.addEventListener('input', function() {
        const error = validateName(this.value, 'first');
        firstnameError.textContent = error;
        this.classList.toggle('error', error !== '');
    });
    
    lastnameInput.addEventListener('input', function() {
        const error = validateName(this.value, 'last');
        lastnameError.textContent = error;
        this.classList.toggle('error', error !== '');
    });
    
    emailInput.addEventListener('input', function() {
        const error = validateEmail(this.value);
        emailError.textContent = error;
        this.classList.toggle('error', error !== '');
    });
    
    passwordInput.addEventListener('input', function() {
        const error = validatePassword(this.value);
        passwordError.textContent = error;
        this.classList.toggle('error', error !== '');
        checkPasswordStrength(this.value);
        
        // Also validate confirm password when password changes
        if (confirmInput.value) {
            const confirmError = validateConfirm(this.value, confirmInput.value);
            confirmErrorText.textContent = confirmError;
            confirmInput.classList.toggle('error', confirmError !== '');
        }
    });
    
    const confirmErrorText = document.getElementById('confirmError');
    confirmInput.addEventListener('input', function() {
        const error = validateConfirm(passwordInput.value, this.value);
        confirmErrorText.textContent = error;
        this.classList.toggle('error', error !== '');
    });
    
    // Form submission
    signupForm.addEventListener('submit', function(e) {
        let isValid = true;
        
        // Validate all fields
        const firstnameErrorText = validateName(firstnameInput.value, 'first');
        const lastnameErrorText = validateName(lastnameInput.value, 'last');
        const emailErrorText = validateEmail(emailInput.value);
        const passwordErrorText = validatePassword(passwordInput.value);
        const confirmErrorTextValue = validateConfirm(passwordInput.value, confirmInput.value);
        
        if (firstnameErrorText) {
            firstnameError.textContent = firstnameErrorText;
            firstnameInput.classList.add('error');
            isValid = false;
        }
        
        if (lastnameErrorText) {
            lastnameError.textContent = lastnameErrorText;
            lastnameInput.classList.add('error');
            isValid = false;
        }
        
        if (emailErrorText) {
            emailError.textContent = emailErrorText;
            emailInput.classList.add('error');
            isValid = false;
        }
        
        if (passwordErrorText) {
            passwordError.textContent = passwordErrorText;
            passwordInput.classList.add('error');
            isValid = false;
        }
        
        if (confirmErrorTextValue) {
            confirmError.textContent = confirmErrorTextValue;
            confirmInput.classList.add('error');
            isValid = false;
        }
        
        if (!termsCheckbox.checked) {
            showPopup('Please accept the Terms of Service and Privacy Policy', 'error');
            isValid = false;
        }
        
        if (!isValid) {
            e.preventDefault();
            showPopup('Please fix the errors above', 'error');
        } else {
            // Show loading state
            signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i>Creating account...';
            signupBtn.disabled = true;
            
            // The form will submit normally
        }
    });
    
    // Show custom popup
    function showPopup(message, type = 'error') {
        popupText.textContent = message;
        popup.classList.add('show');
        
        if (type === 'error') {
            popup.style.backgroundColor = '#ef4444';
        } else if (type === 'success') {
            popup.style.backgroundColor = '#10b981';
        } else {
            popup.style.backgroundColor = '#f97316';
        }
        
        setTimeout(() => {
            popup.classList.remove('show');
            popup.style.backgroundColor = '#f97316';
        }, 4000);
    }
    
    // Add demo account for testing (remove in production)
    function addDemoAccount() {
        const demoBtn = document.createElement('button');
        demoBtn.innerHTML = '<i class="fas fa-user-friends"></i> Try Demo Account';
        demoBtn.style.cssText = `
            width: 100%;
            background: #10b981;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        `;
        demoBtn.onmouseover = () => demoBtn.style.transform = 'translateY(-2px)';
        demoBtn.onmouseout = () => demoBtn.style.transform = 'translateY(0)';
        demoBtn.onclick = () => {
            firstnameInput.value = 'Demo';
            lastnameInput.value = 'User';
            emailInput.value = 'demo@biteongo.com';
            passwordInput.value = 'demo123';
            confirmInput.value = 'demo123';
            termsCheckbox.checked = true;
            showPopup('Demo account loaded! Click Create Account to continue.', 'success');
        };
        
        const helper = document.querySelector('.helper');
        helper.parentNode.insertBefore(demoBtn, helper.nextSibling);
    }
    
    // Uncomment to add demo account button
    // addDemoAccount();
</script>

{% endblock %}
