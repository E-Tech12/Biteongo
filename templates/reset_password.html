{% extends "base.html" %}

{% block title %}Reset Password | Bite On Go{% endblock %}

{% block content %}
<style>
    .pass-reset-container {
        min-height: calc(100vh - 200px);
        background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
        padding: 60px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .pass-reset-card {
        max-width: 500px;
        width: 100%;
        margin: 0 auto;
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        animation: fadeInUp 0.6s ease-out;
    }
    
    .pass-reset-header {
        background: linear-gradient(135deg, #f97316, #ea580c);
        padding: 40px;
        text-align: center;
        color: white;
    }
    
    .pass-reset-header h2 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 10px;
    }
    
    .pass-reset-header p {
        font-size: 0.9rem;
        opacity: 0.95;
    }
    
    .pass-reset-body {
        padding: 40px;
    }
    
    .form-group {
        margin-bottom: 25px;
    }
    
    .pass-reset-body label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
        font-size: 0.875rem;
    }
    
    .password-wrapper {
        position: relative;
    }
    
    .pass-reset-body input {
        width: 100%;
        padding: 12px 40px 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
    }
    
    .pass-reset-body input:focus {
        border-color: #f97316;
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }
    
    .pass-reset-body input.error {
        border-color: #ef4444;
    }
    
    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #9ca3af;
        transition: color 0.3s ease;
    }
    
    .toggle-password:hover {
        color: #f97316;
    }
    
    .error-message {
        color: #ef4444;
        font-size: 12px;
        margin-top: 5px;
        display: block;
    }
    
    .success-message {
        color: #10b981;
        font-size: 12px;
        margin-top: 5px;
        display: block;
    }
    
    .password-strength {
        margin-top: 8px;
    }
    
    .strength-bar {
        height: 4px;
        background: #e5e7eb;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 8px;
    }
    
    .strength-fill {
        height: 100%;
        width: 0%;
        transition: width 0.3s ease, background 0.3s ease;
        border-radius: 2px;
    }
    
    .strength-text {
        font-size: 11px;
        margin-top: 5px;
        display: block;
    }
    
    .pass-reset-body button {
        width: 100%;
        background: #f97316;
        color: white;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
    }
    
    .pass-reset-body button:hover {
        background: #ea580c;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
    }
    
    .pass-reset-body button:disabled {
        background: #d97706;
        cursor: not-allowed;
        opacity: 0.7;
        transform: none;
    }
    
    .back-to-login {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
    }
    
    .back-to-login a {
        color: #f97316;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
    }
    
    .back-to-login a:hover {
        color: #ea580c;
        text-decoration: underline;
    }
    
    .popup-message {
        visibility: hidden;
        min-width: 300px;
        background-color: #f97316;
        color: white;
        text-align: center;
        border-radius: 12px;
        padding: 16px;
        position: fixed;
        z-index: 1000;
        top: 100px;
        right: 30px;
        font-weight: 500;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        opacity: 0;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    .popup-message.show {
        visibility: visible;
        opacity: 1;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @media (max-width: 768px) {
        .pass-reset-header h2 {
            font-size: 1.5rem;
        }
        
        .pass-reset-body {
            padding: 30px 20px;
        }
        
        .popup-message {
            top: 80px;
            right: 20px;
            left: 20px;
            min-width: auto;
        }
    }
</style>

<div class="pass-reset-container">
    <div class="pass-reset-card">
        <div class="pass-reset-header">
            <h2><i class="fas fa-key"></i> Reset Password</h2>
            <p>Enter your new password below</p>
        </div>
        
        <div class="pass-reset-body">
            <form id="resetForm" method="POST">
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" style="margin-right: 8px; color: #f97316;"></i>
                        New Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter new password" required>
                        <span class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <div id="passwordError" class="error-message"></div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">
                        <i class="fas fa-check-circle" style="margin-right: 8px; color: #f97316;"></i>
                        Confirm New Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" placeholder="Confirm new password" required>
                        <span class="toggle-password" onclick="togglePassword('confirm_password')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <div id="confirmError" class="error-message"></div>
                </div>
                
                <button type="submit" id="resetBtn">
                    <i class="fas fa-sync-alt"></i>
                    Reset Password
                </button>
            </form>
            
            <div class="back-to-login">
                <a href="{{ url_for('auth.login') }}">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>

<div id="popup-message" class="popup-message">
    <i class="fas fa-info-circle" style="margin-right: 10px;"></i>
    <span id="popup-text"></span>
</div>

<script>
    const popup = document.getElementById('popup-message');
    const popupText = document.getElementById('popup-text');
    const resetForm = document.getElementById('resetForm');
    const resetBtn = document.getElementById('resetBtn');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    const passwordError = document.getElementById('passwordError');
    const confirmError = document.getElementById('confirmError');
    
    // Show flashed messages
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                popupText.textContent = "{{ message }}";
                popup.classList.add('show');
                
                {% if category == 'error' %}
                    popup.style.backgroundColor = '#ef4444';
                {% elif category == 'success' %}
                    popup.style.backgroundColor = '#10b981';
                {% else %}
                    popup.style.backgroundColor = '#f97316';
                {% endif %}
                
                setTimeout(() => {
                    popup.classList.remove('show');
                    popup.style.backgroundColor = '#f97316';
                }, 4000);
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    // Toggle password visibility
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = field.nextElementSibling.querySelector('i');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    
    // Password strength checker
    function checkPasswordStrength(password) {
        let strength = 0;
        let message = '';
        let color = '';
        
        if (password.length >= 6) strength += 1;
        if (password.length >= 10) strength += 1;
        if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 1;
        if (password.match(/[0-9]/)) strength += 1;
        if (password.match(/[^a-zA-Z0-9]/)) strength += 1;
        
        switch(strength) {
            case 0:
            case 1:
                message = 'Very Weak';
                color = '#ef4444';
                break;
            case 2:
                message = 'Weak';
                color = '#f97316';
                break;
            case 3:
                message = 'Medium';
                color = '#eab308';
                break;
            case 4:
                message = 'Strong';
                color = '#10b981';
                break;
            case 5:
                message = 'Very Strong';
                color = '#059669';
                break;
        }
        
        const width = (strength / 5) * 100;
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        
        if (strengthFill && strengthText) {
            strengthFill.style.width = width + '%';
            strengthFill.style.background = color;
            strengthText.textContent = message;
            strengthText.style.color = color;
        }
        
        return strength >= 3;
    }
    
    // Validate password
    function validatePassword(password) {
        if (password.length < 6) {
            return 'Password must be at least 6 characters';
        }
        if (password.length > 50) {
            return 'Password must be less than 50 characters';
        }
        return '';
    }
    
    function validateConfirm(password, confirm) {
        if (password !== confirm) {
            return 'Passwords do not match';
        }
        return '';
    }
    
    // Real-time validation
    passwordInput.addEventListener('input', function() {
        const error = validatePassword(this.value);
        passwordError.textContent = error;
        this.classList.toggle('error', error !== '');
        
        if (!error) {
            checkPasswordStrength(this.value);
        } else {
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            if (strengthFill && strengthText) {
                strengthFill.style.width = '0%';
                strengthText.textContent = '';
            }
        }
        
        // Also validate confirm password when password changes
        if (confirmInput.value) {
            const confirmErrorText = validateConfirm(this.value, confirmInput.value);
            confirmError.textContent = confirmErrorText;
            confirmInput.classList.toggle('error', confirmErrorText !== '');
        }
    });
    
    confirmInput.addEventListener('input', function() {
        const error = validateConfirm(passwordInput.value, this.value);
        confirmError.textContent = error;
        this.classList.toggle('error', error !== '');
    });
    
    // Form submission with validation
    resetForm.addEventListener('submit', function(e) {
        let isValid = true;
        
        const passwordErrorText = validatePassword(passwordInput.value);
        const confirmErrorText = validateConfirm(passwordInput.value, confirmInput.value);
        
        if (passwordErrorText) {
            passwordError.textContent = passwordErrorText;
            passwordInput.classList.add('error');
            isValid = false;
        }
        
        if (confirmErrorText) {
            confirmError.textContent = confirmErrorText;
            confirmInput.classList.add('error');
            isValid = false;
        }
        
        if (!isValid) {
            e.preventDefault();
            showPopupMessage('Please fix the errors above', 'error');
        } else {
            // Show loading state
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting password...';
            resetBtn.disabled = true;
            // Form will submit normally
        }
    });
    
    // Function to show custom popup
    function showPopupMessage(message, type = 'error') {
        popupText.textContent = message;
        popup.classList.add('show');
        
        if (type === 'error') {
            popup.style.backgroundColor = '#ef4444';
        } else if (type === 'success') {
            popup.style.backgroundColor = '#10b981';
        } else {
            popup.style.backgroundColor = '#f97316';
        }
        
        setTimeout(() => {
            popup.classList.remove('show');
            popup.style.backgroundColor = '#f97316';
        }, 4000);
    }
</script>
{% endblock %}
